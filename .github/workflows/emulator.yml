name: Emulator smoke test

on:
  workflow_dispatch:
    inputs:
      tmdb_probe:
        description: Optional one-off movie TMDB ID. Leave blank for routine tests.
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NOVA_TMDB_PROBE: ${{ inputs.tmdb_probe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: gradle --no-daemon :app:assembleX64Debug
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app/build/outputs/apk/x64/debug/app-x64-debug.apk
            adb shell am start -n app.nova.browser/.MainActivity
            sleep 20
            mkdir -p shots
            adb exec-out screencap -p > shots/1-home.png
            adb shell dumpsys gfxinfo app.nova.browser reset
            adb shell am start -a android.intent.action.VIEW -d https://example.com app.nova.browser
            sleep 12
            adb exec-out screencap -p > shots/2-example.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml shots/ui.xml
            ffmpeg -loglevel error -f lavfi -i testsrc=duration=120:size=320x240:rate=15 -f lavfi -i sine=duration=120 -pix_fmt yuv420p -c:v libx264 -c:a aac testpage/clip.mp4
            mkdir -p testpage/hls
            ffmpeg -loglevel error -i testpage/clip.mp4 -t 120 -c copy -hls_time 4 -hls_playlist_type vod testpage/hls/high.m3u8
            ffmpeg -loglevel error -i testpage/clip.mp4 -t 120 -vf scale=192:144 -c:v libx264 -c:a aac -hls_time 4 -hls_playlist_type vod testpage/hls/low.m3u8
            printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=500000,RESOLUTION=320x240\nhigh.m3u8\n#EXT-X-STREAM-INF:BANDWIDTH=150000,RESOLUTION=192x144\nlow.m3u8\n' > testpage/hls/master.m3u8
            printf 'WEBVTT\n\n00:00:00.000 --> 00:02:00.000\nاختبار الترجمة العربية في نوفا\n' > testpage/ar.vtt
            (python3 testpage/server.py > /tmp/test-server.log 2>&1 &)
            sleep 2
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/popup.html app.nova.browser
            sleep 5
            adb exec-out screencap -p > shots/9-popup-before.png
            adb shell uiautomator dump /sdcard/popup.xml && adb pull /sdcard/popup.xml shots/popup.xml
            adb shell input tap $(python3 testpage/tap-label.py shots/popup.xml 'Open safe tab')
            sleep 5
            adb exec-out screencap -p > shots/10-popup-after.png
            adb shell pidof app.nova.browser
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/test.html app.nova.browser
            sleep 15
            adb exec-out screencap -p > shots/3-detector-page.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml shots/ui2.xml
            python3 testpage/emulator-check.py || { adb logcat -d -s AndroidRuntime:E NovaEngine:I NovaPerf:I ExoPlayerImplInternal:E > shots/crashes.txt; exit 1; }
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/plain.html app.nova.browser
            sleep 8
            adb exec-out screencap -p > shots/6-plain.png
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/protection.html app.nova.browser
            sleep 8
            adb exec-out screencap -p > shots/10b-filter-fixture.png
            adb shell am start -a android.intent.action.VIEW -d https://egybest.website/ app.nova.browser
            sleep 15
            adb exec-out screencap -p > shots/11-reported-site.png
            adb shell uiautomator dump /sdcard/site.xml && adb pull /sdcard/site.xml shots/site.xml
            adb shell input tap $(python3 testpage/tap-label.py shots/site.xml '◇')
            sleep 2
            adb exec-out screencap -p > shots/12-protection.png
            adb shell uiautomator dump /sdcard/shield.xml && adb pull /sdcard/shield.xml shots/shield.xml
            adb shell input tap $(python3 testpage/tap-label.py shots/shield.xml 'uBlock Origin')
            sleep 3
            adb exec-out screencap -p > shots/13-ublock-controls.png
            adb shell uiautomator dump /sdcard/ublock.xml && adb pull /sdcard/ublock.xml shots/ublock.xml
            adb shell input keyevent KEYCODE_BACK
            adb shell input keyevent KEYCODE_BACK
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/frame.html app.nova.browser
            sleep 14
            adb exec-out screencap -p > shots/14-frame-detector.png
            adb shell uiautomator dump /sdcard/frame.xml && adb pull /sdcard/frame.xml shots/frame.xml
            python3 testpage/frame-check.py
            adb shell input keyevent KEYCODE_BACK
            python3 testpage/torrent-consent-check.py || touch shots/regression-failed
            python3 testpage/recovery-check.py || touch shots/regression-failed
            adb shell dumpsys meminfo app.nova.browser > shots/memory.txt
            adb shell dumpsys meminfo --package app.nova.browser > shots/all-process-memory.txt
            adb shell dumpsys gfxinfo app.nova.browser > shots/frames.txt
            python3 testpage/external-check.py || touch shots/regression-failed
            python3 testpage/vidsrc-check.py
            test ! -f shots/regression-failed
            adb logcat -d -s AndroidRuntime:E NovaEngine:I NovaPerf:I ExoPlayerImplInternal:E > shots/crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots
