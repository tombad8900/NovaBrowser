name: Emulator smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: gradle --no-daemon :app:assembleDebug
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.nova.browser/.MainActivity
            sleep 8
            mkdir -p shots
            adb exec-out screencap -p > shots/1-home.png
            adb shell am start -a android.intent.action.VIEW -d https://example.com app.nova.browser
            sleep 12
            adb exec-out screencap -p > shots/2-example.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml shots/ui.xml
            (cd testpage && python3 -m http.server 8000 >/dev/null 2>&1 &)
            sleep 2
            adb shell am start -a android.intent.action.VIEW -d http://10.0.2.2:8000/test.html app.nova.browser
            sleep 15
            adb exec-out screencap -p > shots/3-detector-page.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml shots/ui2.xml
            grep -o 'text="◉[^"]*"' shots/ui2.xml || true
            adb logcat -d -s AndroidRuntime:E > shots/crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots
